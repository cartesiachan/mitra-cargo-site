# Decap CMS — dashboard Gagian Cargo
# Login via GitHub (OAuth proxy di /api/auth). Tiap simpan = commit ke main = auto-rebuild.
backend:
  name: github
  repo: cartesiachan/mitra-cargo-site
  branch: main
  base_url: https://mitra-perkasa-cargo.pages.dev
  auth_endpoint: api/auth

site_url: https://mitra-perkasa-cargo.pages.dev
display_url: https://mitra-perkasa-cargo.pages.dev
media_folder: public/images
public_folder: /images

collections:
  - name: konten
    label: Konten Situs
    files:
      - file: src/data/konten.json
        label: Konten Situs
        name: konten
        fields:
          - { name: brand, label: Nama Brand, widget: string, hint: "Dipakai di logo, footer, dan sapaan WhatsApp. Contoh: Gagian Cargo" }
          - { name: tagline, label: Tagline Logo, widget: string, hint: "Teks kecil di bawah logo. Contoh: EKSPEDISI KARGO · JAKARTA" }
          - name: nav
            label: Menu Navigasi
            widget: list
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: Link, widget: string, hint: "Contoh: /#layanan atau /daftar-harga" }
          - { name: navCta, label: Label Tombol Penawaran, widget: string, hint: "Tombol di menu dan tombol WhatsApp mengambang. Contoh: Minta Penawaran" }
          - name: wa
            label: Pesan WhatsApp
            widget: object
            hint: "Pesan diawali 'Halo {nama brand}, ' secara otomatis — isi lanjutan pesannya saja."
            fields:
              - { name: penawaran, label: Tombol Menu / Sticky, widget: string }
              - { name: penawaranHero, label: Tombol Hero, widget: string }
              - { name: konsultasi, label: Tombol Hubungi Kami, widget: string }
          - name: hero
            label: Hero (Bagian Atas)
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: titleBefore, label: Judul (awal), widget: string, hint: "Bagian sebelum kata yang diberi warna kuning" }
              - { name: titleEm, label: Judul (kuning), widget: string, hint: "Kata yang tampil kuning" }
              - { name: titleAfter, label: Judul (akhir), widget: string }
              - { name: lead, label: Paragraf Pembuka, widget: text }
              - { name: btnWa, label: Label Tombol WhatsApp, widget: string }
              - { name: btnLayanan, label: Label Tombol Layanan, widget: string }
              - name: chips
                label: Chip (label kecil di bawah tombol)
                widget: list
                field: { name: chip, label: Chip, widget: string }
          - name: usp
            label: Kenapa Kami (3 Kartu)
            widget: object
            fields:
              - { name: title, label: Judul, widget: string }
              - name: items
                label: Kartu
                widget: list
                fields:
                  - name: icon
                    label: Ikon
                    widget: select
                    options: [tag, globe, globeSingle, shieldCheck, shield, truck, box, plane, warehouse, clock, motor, refresh]
                  - { name: title, label: Judul, widget: string }
                  - { name: text, label: Teks, widget: text }
          - name: about
            label: Tentang Kami
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: title, label: Judul, widget: string }
              - { name: para1, label: Paragraf 1, widget: text }
              - { name: para2, label: Paragraf 2, widget: text }
              - name: trust
                label: Kotak Kepercayaan (4)
                widget: list
                fields:
                  - { name: title, label: Judul, widget: string }
                  - { name: text, label: Teks, widget: text }
              - { name: visualTitle, label: Judul Kotak Gelap, widget: string }
              - name: visualItems
                label: Isi Kotak Gelap
                widget: list
                fields:
                  - { name: b, label: Label Tebal, widget: string, hint: "Contoh: Kami kerjakan:" }
                  - { name: text, label: Teks, widget: text }
              - name: photo
                label: Foto Tentang
                widget: object
                fields:
                  - { name: src, label: Foto, widget: image }
                  - { name: alt, label: Alt (deskripsi foto), widget: string }
                  - { name: caption, label: Keterangan Foto, widget: text }
          - name: services
            label: Layanan (6 Kartu)
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: title, label: Judul, widget: string }
              - { name: sub, label: Subjudul, widget: text }
              - { name: photoNote, label: Catatan Foto, widget: text }
              - name: items
                label: Kartu Layanan
                widget: list
                fields:
                  - { name: mode, label: Moda, widget: string, hint: "Contoh: Via Laut atau Via Laut · Udara" }
                  - name: icon
                    label: Ikon
                    widget: select
                    options: [tag, globe, globeSingle, shieldCheck, shield, truck, box, plane, warehouse, clock, motor, refresh]
                  - { name: title, label: Judul, widget: string }
                  - { name: cities, label: Kota yang Dilayani, widget: text }
                  - { name: photo, label: Foto, widget: image }
                  - { name: photoAlt, label: Alt Foto, widget: string }
                  - name: waRegion
                    label: Nomor WhatsApp Tujuan
                    widget: select
                    options: [Sulawesi, Maluku, Papua, Kalimantan, Nusa Tenggara, Jawa, Umum]
                  - { name: waText, label: Pesan WhatsApp, widget: string }
                  - { name: btnLabel, label: Label Tombol, widget: string }
          - name: process
            label: Cara Kerja (4 Langkah)
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: title, label: Judul, widget: string }
              - { name: sub, label: Subjudul, widget: text }
              - name: steps
                label: Langkah
                widget: list
                fields:
                  - { name: title, label: Judul, widget: string }
                  - { name: text, label: Teks, widget: text }
          - name: why
            label: Mengapa Memilih Kami
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: title, label: Judul, widget: string }
              - { name: sub, label: Subjudul, widget: text }
              - name: pills
                label: Pil Merah
                widget: list
                field: { name: pill, label: Pil, widget: string }
              - { name: note, label: Catatan di Bawah Pil, widget: text }
              - name: collage
                label: Kolase Foto (3)
                widget: list
                fields:
                  - { name: src, label: Foto, widget: image }
                  - { name: alt, label: Alt Foto, widget: string }
                  - { name: tall, label: Foto Tinggi (hanya 1), widget: boolean, required: false }
              - name: cards
                label: Kartu (4)
                widget: list
                fields:
                  - name: icon
                    label: Ikon
                    widget: select
                    options: [tag, globe, globeSingle, shieldCheck, shield, truck, box, plane, warehouse, clock, motor, refresh]
                  - { name: title, label: Judul, widget: string }
                  - { name: text, label: Teks, widget: text }
          - name: testimonials
            label: Testimoni (3)
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: title, label: Judul, widget: string }
              - { name: intro, label: Pengantar, widget: text }
              - name: items
                label: Testimoni
                widget: list
                fields:
                  - { name: quote, label: Kutipan (tanpa tanda petik), widget: text }
                  - { name: initials, label: Inisial Avatar, widget: string }
                  - { name: name, label: Nama, widget: string }
                  - { name: route, label: Rute, widget: string }
          - name: faq
            label: Tanya Jawab
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: title, label: Judul, widget: string }
              - name: items
                label: Pertanyaan
                widget: list
                fields:
                  - { name: q, label: Pertanyaan, widget: string }
                  - { name: a, label: Jawaban, widget: text }
          - name: cta
            label: Hubungi Kami (CTA)
            widget: object
            fields:
              - { name: title, label: Judul, widget: string }
              - { name: text, label: Teks, widget: text }
          - name: footer
            label: Footer
            widget: object
            fields:
              - { name: tagline, label: Deskripsi Brand, widget: text }
              - name: nav
                label: Link Navigasi Footer
                widget: list
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: href, label: Link, widget: string }
          - name: contact
            label: Kotak Kontak
            widget: object
            fields:
              - { name: marketingTitle, label: Judul Kotak Marketing, widget: string }
              - { name: kantorTitle, label: Judul Kotak Kantor, widget: string }
              - { name: layananTitle, label: Judul Kotak Layanan, widget: string }
              - { name: layananText1, label: Kotak Layanan — Paragraf 1, widget: text }
              - { name: layananText2, label: Kotak Layanan — Paragraf 2, widget: text }
          - name: harga
            label: Halaman Daftar Harga
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: title, label: Judul, widget: string }
              - { name: filterLabel, label: Label Kolom Cari, widget: string }
              - { name: filterPlaceholder, label: Placeholder Kolom Cari, widget: string }
              - { name: noResult, label: Pesan Bila Tidak Ada Hasil, widget: text }
  - name: tarif
    label: Tarif (71 Baris)
    files:
      - file: src/data/tarif.json
        label: Daftar Harga
        name: tarif
        fields:
          - name: rows
            label: Baris Tarif
            widget: list
            fields:
              - { name: c, label: Kota, widget: string }
              - name: r
                label: Wilayah
                widget: select
                options: [Sulawesi, Maluku, Papua]
              - name: s
                label: Layanan
                widget: select
                options: [PELNI, RORO, Reguler]
              - { name: min, label: Min. (kg), widget: number }
              - { name: price, label: Tarif per Kg (Rp), widget: number }
              - { name: eta, label: Estimasi, widget: string, hint: "Contoh: 5–6 hari" }
              - { name: note, label: Keterangan, widget: string, hint: "Contoh: Port to Door" }
  - name: kontak
    label: Kontak
    files:
      - file: src/data/kontak.json
        label: Kontak
        name: kontak
        fields:
          - { name: call_center, label: Call Center (tampil), widget: string, hint: "Contoh: (021) 3455-420" }
          - { name: call_center_intl, label: Call Center (untuk link tel:), widget: string, hint: "Contoh: +62213455420" }
          - { name: whatsapp_umum, label: WhatsApp Umum (tampil), widget: string }
          - { name: whatsapp_umum_intl, label: WhatsApp Umum (angka internasional), widget: string, hint: "Tanpa +, contoh: 6281298242829" }
          - { name: email, label: Email, widget: string }
          - { name: jam, label: Jam Operasional, widget: string }
          - { name: alamat, label: Alamat Kantor, widget: text }
          - name: marketing
            label: Marketing per Wilayah (kotak kontak)
            widget: list
            fields:
              - { name: wilayah, label: Wilayah, widget: string }
              - { name: nomor, label: Nomor (tampil), widget: string }
              - { name: nomor_intl, label: Nomor (internasional), widget: string }
          - name: marketing_wilayah
            label: Nomor WhatsApp per Wilayah (widget Cek Ongkir)
            widget: list
            hint: "Dipakai tombol WhatsApp di widget Cek Ongkir dan kartu layanan."
            fields:
              - name: region
                label: Wilayah
                widget: select
                options: [Papua, Maluku, Sulawesi, Kalimantan, Nusa Tenggara, Jawa]
              - { name: nomor_intl, label: Nomor (internasional), widget: string }
          - { name: note, label: Catatan Internal, widget: text, hint: "Tidak tampil di situs — pengingat soal versi kontak." }
  - name: seo
    label: SEO
    files:
      - file: src/data/seo.json
        label: SEO & Analitik
        name: seo
        fields:
          - { name: gscVerification, label: Kode Verifikasi Google Search Console, widget: string, required: false, hint: "Isi string dari Search Console (meta tag). Kosong = tag tidak tampil." }
          - { name: ga4Id, label: ID Pengukuran GA4, widget: string, required: false, hint: "Contoh: G-XXXXXXXXXX. Kosong = tidak ada pelacakan." }
          - name: home
            label: Beranda
            widget: object
            fields:
              - { name: title, label: Judul (tab browser), widget: string }
              - { name: description, label: Meta Description, widget: text, hint: "Ideal 120–160 karakter, muncul di hasil pencarian Google." }
              - { name: ogTitle, label: Judul Sosial (OG), widget: string, hint: "Judul saat link dibagikan ke WhatsApp/Facebook." }
              - { name: ogDescription, label: Deskripsi Sosial (OG), widget: text }
              - { name: ogImage, label: Gambar Sosial (OG), widget: image, required: false }
          - name: harga
            label: Daftar Harga
            widget: object
            fields:
              - { name: title, label: Judul (tab browser), widget: string }
              - { name: description, label: Meta Description, widget: text }
              - { name: ogTitle, label: Judul Sosial (OG), widget: string }
              - { name: ogDescription, label: Deskripsi Sosial (OG), widget: text }
              - { name: ogImage, label: Gambar Sosial (OG), widget: image, required: false }
