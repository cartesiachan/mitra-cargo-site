<!doctype html>
<html>
<head><meta charset="utf-8"><title>Handshake test (sementara — hapus setelah tes)</title></head>
<body>
<div id="log">waiting</div>
<script>
var log = [];
function say(s){ log.push(s); var el = document.getElementById('log'); el.textContent = log.join(' | '); document.title = log.join(' | '); }
var popup = window.open('/api/callback?code=dummy&state=dummy', 'decap-test', 'width=500,height=600');
if (!popup) { say('POPUP_BLOCKED'); }
else {
  say('popup opened');
  window.addEventListener('message', function(e){
    say('got origin=' + e.origin + ' data=' + e.data);
    if (e.data === 'authorizing:github') {
      popup.postMessage('authorizing:github', 'https://mitra-perkasa-cargo.pages.dev');
      say('echoed authorizing');
    }
  });
}
</script>
</body>
</html>
